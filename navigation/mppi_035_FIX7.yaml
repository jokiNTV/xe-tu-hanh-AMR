controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 300.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.09  # DEMO TEST V1: accept station within 9 cm
      yaw_goal_tolerance: 0.139626  # 8 deg; final yaw handled by one-shot align
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      # Prediction
      time_steps: 72
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1

      # Sampling
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.45
      # Differential-drive limits
      # FIX7: navigation ceiling 0.35 m/s
      vx_max: 0.35
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.20

      # Giữ gần giới hạn động học hiện tại
      ax_max: 0.20
      ax_min: -0.28
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.35
      prune_distance: 1.5
      transform_tolerance: 0.2

      temperature: 0.3
      gamma: 0.015

      motion_model: DiffDrive

      visualize: false

      # Humble MPPI
      reset_period: 1.0
      regenerate_noises: false

      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # Quan trọng nhất cho tường/vật cản.
      # Dùng toàn bộ footprint xe, không chỉ tâm robot.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.5
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      # Không ép bám path quá mạnh:
      # cần cho phép MPPI lách khỏi đường đỏ khi sát tường.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.943, 0.370], [0.943, -0.370], [-0.455, -0.370], [-0.455, 0.370]]'
      footprint_padding: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          # FIX7: RPLIDAR frequently returns +Inf for clear rays. Verified runtime
          # had inf_is_valid=False while /scan_empty_clearance had no publisher.
          # Accept +Inf for raytracing so stale dynamic obstacle cells can clear.
          inf_is_valid: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: '[[0.943, 0.370], [0.943, -0.370], [-0.455, -0.370], [-0.455, 0.370]]'
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          # FIX7: RPLIDAR frequently returns +Inf for clear rays. Verified runtime
          # had inf_is_valid=False while /scan_empty_clearance had no publisher.
          # Accept +Inf for raytracing so stale dynamic obstacle cells can clear.
          inf_is_valid: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true
