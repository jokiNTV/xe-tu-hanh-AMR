# AMR EKF V2.2A TEST - wheel wz fusion added
#
# Single odom authority:
#   Bridge -> /odom_raw, publish_tf=false
#   EKF    -> /odom,     publish_tf=true
#
# Inputs:
#   /odom_ekf_input : wheel vx + constrained body vy=0
#   /imu/data       : relative yaw + gyro Z

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    odom0: /odom_ekf_input
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 30

    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false
