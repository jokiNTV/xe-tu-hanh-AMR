amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.35
    alpha2: 0.25
    alpha3: 0.20
    alpha4: 0.35
    alpha5: 0.20
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    # TURN/MAP FIX V1.0: AMCL receives only scan-gated clean data.
    # Raw /scan remains untouched for RViz/costmaps/Collision Monitor.
    scan_topic: scan_amcl_mid
